<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Pulse AI - Financial Risk Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6 font-sans">
    <header class="max-w-4xl mx-auto mb-8 border-b border-slate-800 pb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wider text-cyan-400">RM PULSE AI</h1>
        <span class="text-xs bg-cyan-950 text-cyan-300 px-3 py-1 rounded-full border border-cyan-800">Bank-Grade Engine</span>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <form id="riskForm" class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">New Risk Assessment</h2>
            
            <div>
                <label class="block text-sm text-slate-400 mb-1">Company Name</label>
                <input type="text" id="companyName" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="e.g. Acme Corp" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Total Debt ($)</label>
                <input type="number" id="debt" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="50000" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Annual Revenue ($)</label>
                <input type="number" id="revenue" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="200000" required>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Industry Sector</label>
                <select id="industry" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    <option value="Technology">Technology</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Finance">Finance</option>
                    <option value="Logistics">Logistics</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-2 px-4 rounded transition duration-200">
                Generate AI Risk Report
            </button>
        </form>

        <div class="space-y-6">
            <div id="resultCard" class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl hidden">
                <h3 class="text-lg font-semibold text-cyan-400 mb-3">Live Assessment Result</h3>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-400">Risk Score:</span>
                    <span id="resScore" class="text-xl font-bold">0%</span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-400">Classification:</span>
                    <span id="resStatus" class="px-2 py-1 rounded text-xs font-bold"></span>
                </div>
                <p id="resSummary" class="text-sm text-slate-300 bg-slate-950 p-3 rounded border border-slate-800"></p>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
                <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Cloud Database History</h3>
                <div id="historyList" class="space-y-2">
                    <p class="text-xs text-slate-500">Loading history...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://qwsqsgjfmfaamtsmzkjl.supabase.co';
        const supabaseKey = 'sb_publishable_Rp1Tn8WcBFvqgDSvZTZ5PQ_WeJW0FFe';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        async function fetchHistory() {
            const { data, error } = await client
                .from('companies_risk_reports')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(5);
            
            const list = document.getElementById('historyList');
            if (error || !data || data.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-500">No reports recorded yet.</p>';
                return;
            }

            list.innerHTML = data.map(item => `
                <div class="flex justify-between items-center text-xs bg-slate-950 p-2 rounded border border-slate-800/60">
                    <span class="font-medium text-slate-200">${item.company_name}</span>
                    <span class="text-cyan-400">${item.status} (${item.risk_score}%)</span>
                </div>
            `).join('');
        }

        document.getElementById('riskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Analyzing & Storing...';
            btn.disabled = true;

            const companyName = document.getElementById('companyName').value;
            const debt = parseFloat(document.getElementById('debt').value) || 0;
            const revenue = parseFloat(document.getElementById('revenue').value) || 1;
            const industry = document.getElementById('industry').value;

            const ratio = debt / revenue;
            let score = Math.min(Math.round(ratio * 50), 100);
            let status = score > 70 ? 'High Risk' : score > 35 ? 'Medium Risk' : 'Low Risk';
            let summary = `AI Financial Analysis: The company operates in the ${industry} sector with a debt-to-revenue ratio of ${(ratio * 100).toFixed(1)}%. Financial exposure is categorized as ${status}.`;

            await client.from('companies_risk_reports').insert([{
                company_name: companyName,
                debt, revenue, industry,
                risk_score: score,
                status, summary
            }]);

            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('resScore').innerText = score + '%';
            
            const statusEl = document.getElementById('resStatus');
            statusEl.innerText = status;
            statusEl.className = `px-2 py-1 rounded text-xs font-bold ${status === 'High Risk' ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}`;
            document.getElementById('resSummary').innerText = summary;

            btn.innerText = 'Generate AI Risk Report';
            btn.disabled = false;
            fetchHistory();
        });

        fetchHistory();
    </script>
</body>
                  </html>
